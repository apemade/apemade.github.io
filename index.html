<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root { --bg:#FFF8E1; --ink:#3E2723; --muted:#6D4C41; --accent:#43A047; --card:#ffffff; }

  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:48px 16px; }
  h1 { margin:0 0 4px; }
  .muted { color:var(--muted); margin-top:0; }
  .card { background:var(--card); border-radius:14px; padding:16px 20px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-top:24px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Ape Made Games</h1>

  <div class="card">
    <h2 style="margin-top:0">Dino Merge</h2>
    <p>Hatch eggs, merge dinosaurs and defend them from meteors.</p>
    <p><a href="dino-merge/privacy/">Privacy policy</a></p>
  </div>
  <p class="muted" style="margin-top:32px">Contact: <a href="mailto:apemakesgames@gmail.com">apemakesgames@gmail.com</a></p>
</main>

</html>
